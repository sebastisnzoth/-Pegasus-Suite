name: Pegasus OSINT regression
on:
  push:
    branches: [main, fix/verified-osint-no-fabricated-whois]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  osint-safety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile osint.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
